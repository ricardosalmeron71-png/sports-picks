# Compila el APK de Android en la nube de Expo (EAS). Al terminar, el link de descarga
# aparece en https://expo.dev (Projects → sports-picks → Builds) y en el log de este workflow.
# Secret necesario: EXPO_TOKEN → https://expo.dev/settings/access-tokens
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Revisar secret
        run: test -n "${{ secrets.EXPO_TOKEN }}" || { echo "::error::Falta el secret EXPO_TOKEN"; exit 1; }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Vincular proyecto de Expo (crea el proyecto la primera vez)
        run: eas init --non-interactive --force
      - name: Compilar APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
